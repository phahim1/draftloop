[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "draftloop"
version = "0.2.0"
description = "Compile ballot comments by clause and check that accepted comments reach the next draft."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Fahim"}]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "python-docx>=1.1", "rapidfuzz>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
draftloop = "draftloop.cli:main"
draftloop-status = "draftloop.status:main"

[tool.setuptools]
packages = ["draftloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
